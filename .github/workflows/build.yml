name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilation
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Test de démarrage (serveur dédié)
        run: bash tools/ci/smoke_server.sh
      - name: Journal complet du serveur
        if: always()
        run: cat /tmp/server.log || true
      - name: Publier le jar (page Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dernier-build --yes --cleanup-tag || true
          gh release create dernier-build build/libs/trounoir-*.jar --title "Trou-Noir — dernier build" \
            --notes "Compilé automatiquement depuis ${GITHUB_SHA::7}. Télécharger trounoir-1.0.0.jar et le placer dans le dossier mods du profil CurseForge."
