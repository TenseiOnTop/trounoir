// Trou-Noir — build Forge 1.21.1 (52.1.20), d'après le MDK officiel de cette version (ForgeGradle 7).
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = '1.0.0'
group = 'net.trounoir'

base {
    archivesName = 'trounoir'
}

// Mojang fournit Java 21 depuis la 1.20.5 : le mod cible Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }

        register('client')

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.1-52.1.20')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
